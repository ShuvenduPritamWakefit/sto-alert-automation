name: STO Alert (daily 18:00 IST)

# Cron is UTC: 12:30 UTC = 18:00 IST. GitHub can start scheduled runs late, and occasionally drops them, on busy slots.
# The 03:20-07:00 IST no-write gate is kept as a safety net for manual runs (the morning STO / vehicle planning reads these tabs).
on:
  schedule:
    - cron: "30 12 * * *"            # 18:00 IST
  workflow_dispatch:                 # adds a manual "Run workflow" button for testing (the gate below still applies)

concurrency:
  group: sto-alert
  cancel-in-progress: false          # a second run waits for the first, it never writes alongside it

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip inside the planning window (03:20-07:00 IST)
        id: gate
        run: |
          now=$(TZ=Asia/Kolkata date +%H%M)
          if (( 10#$now >= 320 && 10#$now < 700 )); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$now IST is inside the 03:20-07:00 no-write window, nothing written"
          else
            echo "::notice::$now IST, running"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run the notebook
        if: steps.gate.outputs.skip != 'true'
        run: papermill daily_sto_alert_fetch.ipynb executed_run.ipynb -k python3 --log-output

      - name: Save executed notebook (for debugging)
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-run-${{ github.run_number }}
          path: executed_run.ipynb
          retention-days: 7
